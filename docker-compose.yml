# Hyper-V Docker: chip-relay with persistent ledger/threads and boot .env (no secrets in image).
# See docs/DOCKER.md

services:
  chip-relay:
    build: .
    image: chip-relay:latest
    restart: unless-stopped
    environment:
      CHIP_CHAT_DATA_DIR: /data/chip-chat
      CHIP_FEED_ENABLED: "1"
      # Read-only homelab probes each tick. Discord wake needs Ally GO:
      # CHIP_FEED_HOMELAB_WAKE=1 (see docs/CHIP_MONITOR_P2.md).
      CHIP_FEED_HOMELAB: "1"
      CHIP_FEED_DOWNLOADS: /downloads
      # monitoring-api host publish was retired (razzorstack PR #616): the
      # monitor is reached over the shared razzorstack media network by
      # container DNS (full-URL target form; see CHIP_FEED_TARGETS law in
      # scripts/chip_relay/monitor_feed.py).
      CHIP_FEED_TARGETS: "monitoring-api=http://monitoring-api:48082"
      # Jev (typesafe/jev-1.13) LIVE GO (Ally 2026-10-05 — verified live on the
      # chipchat key first). Shadow law intact: bands are hypotheses, jev
      # never flips a gate, conservative default always wins.
      CHIP_JEV_LIVE: "1"
      # Case intake router (RAZ-348). Default off. Mock lane only when 1.
      CASE_INTAKE_ENABLED: "1"
      CASE_INTAKE_SKIP_SPEND_GATE: "1"
      CASE_INTAKE_CHANNELS: "monitoring-logs"
    volumes:
      - chip-chat-data:/data/chip-chat
      - ./.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - razzor-nas-torrents:/downloads:ro
    networks:
      - razzor-media
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:48082/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  chip-chat-data:
    # Relay state (ledger/threads). External so compose never re-creates
    # (and never clobbers) the existing chip-chat_chip-chat-data volume.
    external: true
    name: chip-chat_chip-chat-data
  razzor-nas-torrents:
    external: true

networks:
  razzor-media:
    external: true
    name: razzorstack_media_network
