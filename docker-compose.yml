# Hyper-V Docker: chip-relay with persistent ledger/threads and boot .env (no secrets in image).
# See docs/DOCKER.md

services:
  chip-relay:
    build: .
    image: chip-relay:latest
    restart: unless-stopped
    environment:
      CHIP_CHAT_DATA_DIR: /data/chip-chat
      CHIP_FEED_ENABLED: "1"
      # Read-only homelab probes each tick. Discord wake needs Ally GO:
      # CHIP_FEED_HOMELAB_WAKE=1 (see docs/CHIP_MONITOR_P2.md).
      CHIP_FEED_HOMELAB: "1"
      CHIP_FEED_DOWNLOADS: /downloads
    volumes:
      - chip-chat-data:/data/chip-chat
      - ./.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - razzor-nas-torrents:/downloads:ro
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:48082/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  chip-chat-data:
  razzor-nas-torrents:
    external: true
