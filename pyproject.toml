[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-chat"
version = "0.1.0"
description = "Chip Chat — cheap multi-agent OpenRouter CLI"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]
relay = ["discord.py>=2.4"]

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
pythonpath = ["scripts"]
