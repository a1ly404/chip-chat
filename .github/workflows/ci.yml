name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install -e '.[dev]'
      - name: Mock tests
run: run: python3 -m pytest scripts/test_chip_alert_ingest.py scripts/test_chip_authorize_wiring.py scripts/test_chip_boards.py scripts/test_chip_chat.py scripts/test_chip_claims_standalone.py scripts/test_chip_collab.py scripts/test_chip_counter_registry.py scripts/test_chip_done_gate.py scripts/test_chip_done_gate_cli.py scripts/test_chip_done_gate_sweep.py scripts/test_chip_jev_router.py scripts/test_chip_lane_amendment.py scripts/test_chip_lanes.py scripts/test_chip_law_harness.py scripts/test_chip_learnings.py scripts/test_chip_mempalace.py scripts/test_chip_mock.py scripts/test_chip_monitor_watchdog.py scripts/test_chip_openrouter_reasoning.py scripts/test_chip_pm_tools.py scripts/test_chip_relay.py scripts/test_chip_relay_delegate.py scripts/test_chip_relay_empty_reply.py scripts/test_chip_relay_gateway.py scripts/test_chip_relay_harness.py scripts/test_chip_relay_health.py scripts/test_chip_relay_heartbeat_gate.py scripts/test_chip_relay_monitor_feed.py scripts/test_chip_relay_personas.py scripts/test_chip_relay_prefix_stacking.py scripts/test_chip_relay_selftest.py scripts/test_chip_relay_taskbrief.py scripts/test_chip_relay_up.py scripts/test_chip_relay_wake.py scripts/test_chip_selfheal.py scripts/test_chip_standup.py scripts/test_chip_standup_collectors.py scripts/test_chip_standup_emit.py scripts/test_chip_standup_signal.py scripts/test_chip_store_prefix_guard.py scripts/test_chip_task_ledger.py scripts/test_chip_taskflow.py scripts/test_chip_taskflow_cli.py scripts/test_chip_text_sources.py scripts/test_chip_tool.py scripts/test_ci_workflow_guard.py scripts/test_day0_baseline.py scripts/test_ops_ab_harness.py scripts/test_ops_heartbeat_watchdog.py scripts/test_skill_bodies.py scripts/test_skill_template.py scripts/test_spec_a_standing_law.py scripts/test_spec_b_evidence.py scripts/test_spec_d_thrift.py scripts/test_voice_patterns.py -q scripts/test_chip_adversarial_wip.py69ac680 (ci: pin test_chip_adversarial_wip.py (guard pin list = disk suite; suite green before push))
      - name: Launcher smoke
        run: |
          chmod +x bin/chip
          CHIP_CHAT_MOCK=1 ./bin/chip ping
          CHIP_CHAT_MOCK=1 ./bin/chip done-gate --file validation/buffr-envelope.json --json || test $? -eq 2
          CHIP_CHAT_MOCK=1 ./bin/chip chat --once 'Reply with exactly: pong'
